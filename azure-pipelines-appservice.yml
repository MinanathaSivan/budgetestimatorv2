# azure-pipelines-appservice.yml
# Deploys CODE to the existing App Service zagobestdv01ae1web01.
# Does NOT create infrastructure — the app, plan, slot, private endpoint and
# Easy Auth are provisioned once in the portal/CLI.
#
# Flow: build SPA -> bundle server+api+dist -> deploy to STAGING slot ->
# push app settings -> manual approval -> swap staging into production.

trigger:
  branches:
    include: [ main ]

pool:
  name: z-ago-devops-agent-np-as1-vmss01
  vmImage: ubuntu-latest



variables:
  - group: web-development        # azureSubscription, appName, resourceGroup, slotName, secrets

stages:
- stage: Build
  jobs:
  - job: build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '24.x'      # match the App Service runtime NODE|24-lts
      displayName: 'Use Node 24'

    - script: |
        cd app
        npm install
        npm run build
      displayName: 'Build SPA (app/dist)'

    - script: |
        set -e
        mkdir -p deploy
        cp server.js package.json deploy/
        cp -r api deploy/api
        cp -r app/dist deploy/dist
        cd deploy
        npm install --omit=dev
      displayName: 'Assemble server bundle'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'deploy'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
      artifact: app

- stage: DeployStaging
  dependsOn: Build
  jobs:
  - deployment: deployStaging
    environment: 'Staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: app

          # Push application settings to the STAGING slot before deploying code.
          - task: AzureAppServiceSettings@1
            displayName: 'Apply app settings (staging slot)'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(appName)'
              resourceGroupName: '$(resourceGroup)'
              slotName: '$(slotName)'
              appSettings: |
                [
                  { "name": "TABLES_CONNECTION",    "value": "$(TABLES_CONNECTION)",    "slotSetting": false },
                  { "name": "AWS_ACCESS_KEY_ID",    "value": "$(AWS_ACCESS_KEY_ID)",    "slotSetting": false },
                  { "name": "AWS_SECRET_ACCESS_KEY","value": "$(AWS_SECRET_ACCESS_KEY)","slotSetting": false },
                  { "name": "REFRESH_SECRET",       "value": "$(REFRESH_SECRET)",       "slotSetting": false },
                  { "name": "WEBSITE_RUN_FROM_PACKAGE",        "value": "1",     "slotSetting": false },
                  { "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",  "value": "false", "slotSetting": false },
                  { "name": "WEBSITES_PORT",                   "value": "8080",  "slotSetting": false }
                ]

          - task: AzureWebApp@1
            displayName: 'Deploy code to staging slot'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(appName)'
              deployToSlotOrASE: true
              resourceGroupName: '$(resourceGroup)'
              slotName: '$(slotName)'
              package: '$(Pipeline.Workspace)/app/app.zip'
              runtimeStack: 'NODE|24-lts'
              startUpCommand: 'node server.js'

