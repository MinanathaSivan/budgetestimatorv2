# azure-pipelines-appservice.yml
# DEPLOY-ONLY: the self-hosted agent has no internet, so it does NOT build.
# The bundle (server.js + api + dist + node_modules) is pre-built and uploaded
# to blob storage. This pipeline fetches it and deploys to the ASE staging slot.

trigger:
  branches:
    include: [ main ]

pool:
  name: z-ago-devops-agent-np-as1-vmss01

variables:
  - group: web-development        # azureSubscription, appName, resourceGroup, slotName, secrets
  - name: storageAccount
    value: '<YOUR_STORAGE_ACCOUNT>'   # <-- fill in
  - name: storageContainer
    value: '<YOUR_CONTAINER>'         # <-- fill in (e.g. builds)
  - name: bundleName
    value: 'app-bundle.zip'

stages:
- stage: DeployStaging
  jobs:
  - deployment: deployStaging
    environment: 'Staging'
    strategy:
      runOnce:
        deploy:
          steps:
          # 1. Fetch the pre-built bundle from blob storage.
          #    Uses the service connection identity — no storage keys in the pipeline.
          - task: AzureCLI@2
            displayName: 'Fetch build bundle from blob'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                az storage blob download \
                  --account-name "$(storageAccount)" \
                  --container-name "$(storageContainer)" \
                  --name "$(bundleName)" \
                  --file "$(Pipeline.Workspace)/app.zip" \
                  --auth-mode login
                ls -la "$(Pipeline.Workspace)/app.zip"

          # 2. Push app settings to the staging slot.
          - task: AzureAppServiceSettings@1
            displayName: 'Apply app settings (staging slot)'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(appName)'
              resourceGroupName: '$(resourceGroup)'
              slotName: '$(slotName)'
              appSettings: |
                [
                  { "name": "TABLES_CONNECTION",    "value": "$(TABLES_CONNECTION)",    "slotSetting": false },
                  { "name": "AWS_ACCESS_KEY_ID",    "value": "$(AWS_ACCESS_KEY_ID)",    "slotSetting": false },
                  { "name": "AWS_SECRET_ACCESS_KEY","value": "$(AWS_SECRET_ACCESS_KEY)","slotSetting": false },
                  { "name": "REFRESH_SECRET",       "value": "$(REFRESH_SECRET)",       "slotSetting": false },
                  { "name": "WEBSITE_RUN_FROM_PACKAGE",       "value": "1",     "slotSetting": false },
                  { "name": "SCM_DO_BUILD_DURING_DEPLOYMENT", "value": "false", "slotSetting": false },
                  { "name": "WEBSITES_PORT",                  "value": "8080",  "slotSetting": false }
                ]

          # 3. Deploy the bundle to the staging slot.
          - task: AzureWebApp@1
            displayName: 'Deploy to staging slot'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(appName)'
              deployToSlotOrASE: true
              resourceGroupName: '$(resourceGroup)'
              slotName: '$(slotName)'
              package: '$(Pipeline.Workspace)/app.zip'
              runtimeStack: 'NODE|24-lts'
              startUpCommand: 'node server.js'

